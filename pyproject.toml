[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supporthub"
version = "0.1.0"
description = "Data generators and pipelines for the SupportHub KYC operations analytics platform"
requires-python = ">=3.11"
dependencies = [
    "faker>=24",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["data_generator*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: `spark` and `dbutils` are injected by the runtime, imports sit in cells.
"databricks/**/*.py" = ["F821", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
